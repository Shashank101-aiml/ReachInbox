services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox
      POSTGRES_DB: reachinbox
    # Host port 5433 (not 5432) to avoid clashing with a locally installed Postgres.
    ports:
      - "5433:5432"
    volumes:
      - reachinbox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: unless-stopped
    # appendonly so delayed BullMQ jobs survive a Redis restart, not just a server restart.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - reachinbox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reachinbox_postgres_data:
  reachinbox_redis_data:
